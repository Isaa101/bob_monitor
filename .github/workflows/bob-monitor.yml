name: BOB reservas monitor

on:
  workflow_dispatch:
  schedule:
    # Cada 5 minutos. Se empieza en el minuto 2 para evitar el pico
    # habitual del inicio exacto de cada hora.
    - cron: "2/5 * * * *"

permissions:
  contents: write

concurrency:
  group: bob-monitor-repo-write
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar dependencias Python
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Comprobar disponibilidad BOB
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # ubuntu-latest ya trae Google Chrome instalado.
          PLAYWRIGHT_CHANNEL: chrome
        run: python bob_monitor.py --once

      - name: Guardar estado si ha cambiado
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state.json

          if git diff --cached --quiet; then
            echo "El estado no ha cambiado."
            exit 0
          fi

          git commit -m "chore: actualizar estado BOB [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

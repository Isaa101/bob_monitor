name: Mantener monitor activo

on:
  workflow_dispatch:
  schedule:
    # Una vez al mes. Genera actividad real en el repositorio antes
    # del límite de 60 días de inactividad de workflows programados.
    - cron: "17 9 1 * *"

permissions:
  contents: write

concurrency:
  group: bob-monitor-repo-write
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Actualizar keepalive
        shell: bash
        run: |
          set -e
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .bob-keepalive

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .bob-keepalive
          git commit -m "chore: mantener workflows activos [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
